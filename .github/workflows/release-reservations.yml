# Free alternative to a frequent Vercel cron (Hobby plans allow only daily crons).
# Every 15 minutes, cancels unpaid online orders older than 30 minutes and frees their stock.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SITE_URL     e.g. https://your-store.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET environment variable on Vercel
name: Release expired stock reservations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call release-reservations endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/release-reservations"
