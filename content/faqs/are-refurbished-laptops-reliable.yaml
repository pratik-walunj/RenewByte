question: "Are refurbished laptops reliable?"
answer: "A well-refurbished laptop is very reliable. Most of our laptops are business models from Dell, Lenovo and HP that were built for years of daily office use. Each one passes the same diagnostic tests before it is listed, faulty parts are repaired or replaced, and it is covered by the warranty shown on its product page."
