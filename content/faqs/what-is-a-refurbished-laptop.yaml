question: "What is a refurbished laptop?"
answer: "A refurbished laptop is a previously used laptop that has been professionally inspected, tested, cleaned, repaired where needed and securely wiped before being sold again. Unlike a laptop sold \"as-is\", every refurbished laptop we sell passes full hardware diagnostics, is graded for cosmetic condition and comes with a warranty."
