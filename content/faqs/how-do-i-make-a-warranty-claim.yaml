question: "How do I make a warranty claim?"
answer: "Contact us by phone, WhatsApp or email with your order number and a description of the problem — photos or a short video help. We'll try to solve it remotely first. If the laptop needs inspection, we'll arrange pickup, diagnose the fault and repair or replace it at no cost if it's covered."
