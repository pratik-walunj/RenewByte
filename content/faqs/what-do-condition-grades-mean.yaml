question: "What do the condition grades A+, A, B and C mean?"
answer: "Grades describe cosmetic condition only. A+ looks close to new, A has light signs of use, B has visible wear and C has heavy cosmetic wear at the lowest price. Every grade passes the same hardware and performance tests, so a Grade B laptop works just as well as a Grade A+ laptop of the same model. See the full comparison on our Condition grades page."
