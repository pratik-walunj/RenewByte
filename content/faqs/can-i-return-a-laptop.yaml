question: "Can I return a laptop?"
answer: "Yes. You can request a return within 7 days of delivery if the laptop is faulty, not as described, or if you've changed your mind — as long as it's returned in the same condition with its charger and accessories. Returns for faults or incorrect items are free. See our Returns & refunds policy for details."
