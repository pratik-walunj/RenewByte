whyRefurbished:
  title: Why buy refurbished?
  subtitle: >-
    A well-refurbished business laptop often outlasts a new budget machine —
    at a fraction of the price.
  points:
    - icon: wallet
      title: Better hardware for your budget
      description: >-
        Premium business and creator laptops at prices usually reserved for
        entry-level models.
    - icon: gauge
      title: Built to last
      description: >-
        Business lines like Latitude, ThinkPad and EliteBook are designed for
        years of daily use, with sturdier chassis and keyboards.
    - icon: badge-check
      title: Transparent condition
      description: >-
        Every listing states its cosmetic grade and measured battery health —
        no guesswork.
    - icon: leaf
      title: Less e-waste
      description: >-
        Extending a laptop's life avoids the resources and emissions of
        manufacturing a new one.
